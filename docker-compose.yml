# `db` persists across restarts for development; `test-db` lives in RAM so every
# `docker compose down` is a clean slate for the integration suite.
services:
  db:
    image: postgres:17-alpine
    container_name: deskroute-db
    environment:
      POSTGRES_USER: deskroute
      POSTGRES_PASSWORD: deskroute
      POSTGRES_DB: deskroute
    ports:
      - "${DESKROUTE_DB_PORT:-5432}:5432"
    volumes:
      - deskroute-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskroute -d deskroute"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-db:
    image: postgres:17-alpine
    container_name: deskroute-test-db
    environment:
      POSTGRES_USER: deskroute
      POSTGRES_PASSWORD: deskroute
      POSTGRES_DB: deskroute_test
    ports:
      - "5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskroute -d deskroute_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  deskroute-db-data:
